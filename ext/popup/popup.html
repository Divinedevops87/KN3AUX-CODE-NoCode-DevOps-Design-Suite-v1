<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🏛️ Louisiana Government Resource Discovery</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <img src="../assets/logo/kn3aux-logo-final.png" alt="Louisiana Gov Resources" class="logo">
    <h1>🏛️ Louisiana Government Resources</h1>
    
    <!-- Search Section -->
    <div class="search-section">
      <input type="text" id="searchInput" placeholder="🔍 Search for benefits, services, programs..." />
      <button id="searchBtn">Search</button>
    </div>

    <!-- Quick Access Buttons -->
    <div class="quick-access">
      <button id="benefitsBtn" class="category-btn">
        💰 Benefits & Financial Aid
      </button>
      <button id="healthcareBtn" class="category-btn">
        🏥 Healthcare & Insurance
      </button>
      <button id="housingBtn" class="category-btn">
        🏠 Housing Assistance
      </button>
      <button id="foodBtn" class="category-btn">
        🍽️ Food & Nutrition
      </button>
      <button id="veteransBtn" class="category-btn">
        🎖️ Veterans Services
      </button>
      <button id="educationBtn" class="category-btn">
        📚 Education & Training
      </button>
    </div>

    <!-- Eligibility Screening -->
    <div class="eligibility-section">
      <button id="eligibilityBtn" class="primary-btn">
        📋 Check Your Eligibility
      </button>
    </div>

    <!-- Location Services -->
    <div class="location-section">
      <button id="locationBtn" class="secondary-btn">
        📍 Find Local Services
      </button>
    </div>

    <!-- Language Selector -->
    <div class="language-section">
      <select id="languageSelect">
        <option value="en">🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
      </select>
    </div>

    <!-- Results Container -->
    <div id="resultsContainer" class="results-container hidden">
      <h3>📋 Available Resources</h3>
      <div id="resultsList"></div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading hidden">
      <div class="spinner"></div>
      <p>Searching government databases...</p>
    </div>

    <p class="footer">© 2025 Krisshatta Nicole Esclovon™ • Louisiana Gov Resources</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
